AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Nexo SaaS — Infraestructura FREE TIER optimizada.
  EC2 t2.micro (ECS on EC2, sin Fargate) + RDS t2.micro.
  Sin ALB ni NAT Gateway. Costo estimado: $0/mes (primeros 12 meses).

  FLUJO COMPLETO:
    1. Crear stack: aws cloudformation deploy ...
    2. Autenticarse en ECR y subir imágenes (ver Outputs)
    3. Inicializar BD: correr init.sql en RDS (ver instrucciones abajo)
    4. Reiniciar tarea ECS para que tome las imágenes
    5. Abrir http://<ElasticIP> en el browser

  DESTRUIR TODO:
    1. Vaciar repos ECR: aws ecr batch-delete-image ...
    2. aws cloudformation delete-stack --stack-name nexo-prod

Parameters:

  ProjectName:
    Type: String
    Default: nexo

  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 12
    Description: "Contraseña para PostgreSQL (mín 12 chars). Ej: NexoPass2026!!"

  JwtSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: "Secreto JWT (mín 32 chars). Genera con: openssl rand -hex 32"

  NvidiaApiKey:
    Type: String
    NoEcho: true
    Description: "API Key de NVIDIA NIM (nvapi-xxxx)"

  NvidiaNimUrl:
    Type: String
    Default: 'https://integrate.api.nvidia.com/v1'

  GlmModel:
    Type: String
    Default: 'z-ai/glm-5.1'

  EC2InstanceType:
    Type: String
    Default: t2.micro
    AllowedValues: [t2.micro, t3.micro]
    Description: "t2.micro es Free Tier. t3.micro también si está disponible en tu región."

  DBInstanceClass:
    Type: String
    Default: db.t2.micro
    AllowedValues: [db.t2.micro, db.t3.micro]
    Description: "db.t2.micro es Free Tier (750 h/mes)"

  AllowSSHFrom:
    Type: String
    Default: '0.0.0.0/0'
    Description: "CIDR que puede hacer SSH a la EC2. Cambia a tu IP pública para más seguridad."

Resources:

  # ── VPC ───────────────────────────────────────────────────────────────────

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-vpc'

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  IGWAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # Subnet pública para EC2 (necesita internet para pull de ECR)
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-public'

  # RDS subnet group requiere mínimo 2 AZs
  RDSSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-rds-1'

  RDSSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-rds-2'

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: IGWAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # ── Security Groups ───────────────────────────────────────────────────────

  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: 'EC2 ECS host — HTTP público + SSH opcional'
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowSSHFrom
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-ec2-sg'

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: 'RDS PostgreSQL — solo desde EC2'
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref EC2SecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-rds-sg'

  # ── ECR Repositories ──────────────────────────────────────────────────────

  BackendECR:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${ProjectName}-backend'
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [{
              "rulePriority": 1,
              "description": "Mantener solo las últimas 3 imágenes (free tier 500MB)",
              "selection": {
                "tagStatus": "any",
                "countType": "imageCountMoreThan",
                "countNumber": 3
              },
              "action": { "type": "expire" }
            }]
          }

  FrontendECR:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${ProjectName}-frontend'
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [{
              "rulePriority": 1,
              "description": "Mantener solo las últimas 3 imágenes (free tier 500MB)",
              "selection": {
                "tagStatus": "any",
                "countType": "imageCountMoreThan",
                "countNumber": 3
              },
              "action": { "type": "expire" }
            }]
          }

  # ── RDS PostgreSQL ────────────────────────────────────────────────────────

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub '${ProjectName} DB subnets'
      SubnetIds:
        - !Ref RDSSubnet1
        - !Ref RDSSubnet2

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete        # Permite eliminar sin snapshot — facilita teardown
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub '${ProjectName}-db'
      DBName: nexo
      DBInstanceClass: !Ref DBInstanceClass
      Engine: postgres
      EngineVersion: '15.7'
      MasterUsername: nexo_user
      MasterUserPassword: !Ref DBPassword
      AllocatedStorage: '20'
      StorageType: gp2
      MultiAZ: false
      PubliclyAccessible: false
      VPCSecurityGroups:
        - !Ref RDSSecurityGroup
      DBSubnetGroupName: !Ref DBSubnetGroup
      BackupRetentionPeriod: 1    # Mínimo para free tier (0 desactiva backups)
      DeletionProtection: false   # false para poder destruir el stack fácilmente

  # ── IAM ───────────────────────────────────────────────────────────────────

  # EC2 instance profile para que el host se registre en el cluster ECS y pueda
  # hacer pull de imágenes desde ECR
  EC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-ec2-instance-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore  # Para ECS Exec / Session Manager

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub '${ProjectName}-ec2-instance-profile'
      Roles:
        - !Ref EC2InstanceRole

  # Role para que ECS pueda descargar la imagen desde ECR y escribir logs
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-task-execution-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-task-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: exec-command
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: '*'

  # ── ECS Cluster ───────────────────────────────────────────────────────────

  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${ProjectName}-cluster'
      Configuration:
        ExecuteCommandConfiguration:
          Logging: DEFAULT

  # ── CloudWatch Log Groups ─────────────────────────────────────────────────

  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${ProjectName}'
      RetentionInDays: 7    # 7 días en free tier (5GB incluido)

  # ── EC2 (ECS host) ────────────────────────────────────────────────────────

  # Key Pair debe crearse manualmente en la consola AWS antes de desplegar
  # si quieres SSH. O déjalo en blanco y usa ECS Exec / Session Manager.
  EC2LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub '${ProjectName}-lt'
      LaunchTemplateData:
        ImageId: !Sub '{{resolve:ssm:/aws/service/ecs/optimized-ami/amazon-linux-2/recommended/image_id}}'
        InstanceType: !Ref EC2InstanceType
        IamInstanceProfile:
          Arn: !GetAtt EC2InstanceProfile.Arn
        SecurityGroupIds:
          - !Ref EC2SecurityGroup
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            echo ECS_CLUSTER=${ProjectName}-cluster >> /etc/ecs/ecs.config
            echo ECS_ENABLE_TASK_ENI=false >> /etc/ecs/ecs.config
            yum update -y
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub '${ProjectName}-ecs-host'

  ECSAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn: IGWAttachment
    Properties:
      AutoScalingGroupName: !Sub '${ProjectName}-asg'
      MinSize: '1'
      MaxSize: '1'
      DesiredCapacity: '1'
      VPCZoneIdentifier:
        - !Ref PublicSubnet
      LaunchTemplate:
        LaunchTemplateId: !Ref EC2LaunchTemplate
        Version: !GetAtt EC2LaunchTemplate.LatestVersionNumber
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-ecs-host'
          PropagateAtLaunch: true

  # Elastic IP para tener una IP pública estable (gratis mientras la instancia corre)
  ElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  # La asociación la hace un custom resource o manualmente (ver instrucciones).
  # EIP debe asociarse al EC2 después de que el ASG lo lance.
  # Por simplicidad, la asociación se muestra en el Output y se hace con 1 comando.

  # ── ECS Task Definition ───────────────────────────────────────────────────
  #
  # NetworkMode: bridge — los contenedores se comunican via Docker links.
  # El contenedor frontend usa Links: ["backend:backend"] para que nginx
  # pueda hacer proxy_pass http://backend:4000.
  # El puerto 80 del host (EC2) se mapea al puerto 80 del frontend.

  AppTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-app'
      NetworkMode: bridge
      RequiresCompatibilities:
        - EC2
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      ContainerDefinitions:

        # ── Backend Node.js ──────────────────────────────────────────────
        - Name: backend
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}-backend:latest'
          Essential: true
          Cpu: 256
          Memory: 512
          PortMappings:
            - ContainerPort: 4000
              Protocol: tcp
              # Sin hostPort → ECS asigna puerto dinámico en el host (solo accesible desde nginx via link)
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: PORT
              Value: '4000'
            - Name: DB_HOST
              Value: !GetAtt Database.Endpoint.Address
            - Name: DB_PORT
              Value: '5432'
            - Name: DB_NAME
              Value: nexo
            - Name: DB_USER
              Value: nexo_user
            - Name: DB_PASSWORD
              Value: !Ref DBPassword
            - Name: JWT_SECRET
              Value: !Ref JwtSecret
            - Name: NVIDIA_API_KEY
              Value: !Ref NvidiaApiKey
            - Name: NVIDIA_BASE_URL
              Value: !Ref NvidiaNimUrl
            - Name: GLM_MODEL
              Value: !Ref GlmModel
            - Name: FRONTEND_URL
              Value: !Sub 'http://${ElasticIP}'
          HealthCheck:
            Command: ['CMD-SHELL', 'wget -qO- http://localhost:4000/api/health || exit 1']
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AppLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: backend

        # ── Frontend nginx ────────────────────────────────────────────────
        - Name: frontend
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}-frontend:latest'
          Essential: true
          Cpu: 128
          Memory: 128
          PortMappings:
            - HostPort: 80          # Puerto 80 del EC2 → puerto 80 del contenedor nginx
              ContainerPort: 80
              Protocol: tcp
          Links:
            - backend:backend       # nginx.prod.conf usa proxy_pass http://backend:4000
          DependsOn:
            - ContainerName: backend
              Condition: START
          HealthCheck:
            Command: ['CMD-SHELL', 'wget -qO- http://localhost/ || exit 1']
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 30
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AppLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: frontend

  # ── ECS Service ───────────────────────────────────────────────────────────

  AppService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub '${ProjectName}-app'
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref AppTaskDefinition
      DesiredCount: 1
      LaunchType: EC2
      DeploymentConfiguration:
        MinimumHealthyPercent: 0    # Permite detener la tarea antes de lanzar la nueva
        MaximumPercent: 100         # En t2.micro solo hay recursos para 1 tarea
      EnableExecuteCommand: true    # Permite "aws ecs execute-command" para debug/migraciones

# ─────────────────────────────────────────────────────────────────────────────
Outputs:
# ─────────────────────────────────────────────────────────────────────────────

  ElasticIPAddress:
    Description: >
      IP pública de la aplicación.
      NOTA: Debes asociar esta EIP a la instancia EC2 manualmente (ver instrucciones).
    Value: !Ref ElasticIP

  BackendECRUri:
    Description: URI del repo ECR del backend — úsalo en el docker push
    Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}-backend'

  FrontendECRUri:
    Description: URI del repo ECR del frontend — úsalo en el docker push
    Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}-frontend'

  DatabaseEndpoint:
    Description: Endpoint del RDS PostgreSQL (para correr init.sql)
    Value: !GetAtt Database.Endpoint.Address

  ECSClusterName:
    Description: Nombre del cluster ECS
    Value: !Ref ECSCluster

  ECSServiceName:
    Description: Nombre del servicio ECS
    Value: !Sub '${ProjectName}-app'

  ECRLoginCommand:
    Description: Comando para autenticarse en ECR
    Value: !Sub 'aws ecr get-login-password --region ${AWS::Region} | docker login --username AWS --password-stdin ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com'
