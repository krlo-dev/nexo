name: Deploy to AWS

on:
  push:
    branches: [develop]

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --platform linux/amd64 -t $ECR_REGISTRY/nexo-backend:latest \
            -t $ECR_REGISTRY/nexo-backend:$IMAGE_TAG ./backend
          docker push $ECR_REGISTRY/nexo-backend:latest
          docker push $ECR_REGISTRY/nexo-backend:$IMAGE_TAG

      - name: Build and push frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --platform linux/amd64 -t $ECR_REGISTRY/nexo-frontend:latest \
            -t $ECR_REGISTRY/nexo-frontend:$IMAGE_TAG ./frontend
          docker push $ECR_REGISTRY/nexo-frontend:latest
          docker push $ECR_REGISTRY/nexo-frontend:$IMAGE_TAG

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster nexo-cluster \
            --service nexo-app \
            --desired-count 1 \
            --force-new-deployment \
            --query 'service.serviceName' \
            --output text

      - name: Wait for ECS service stability
        run: |
          aws ecs wait services-stable \
            --cluster nexo-cluster \
            --services nexo-app
          echo "✓ Servicio ECS estable y corriendo"
