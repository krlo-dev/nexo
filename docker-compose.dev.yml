version: '3.9'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    networks:
      - nexo-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: npm run dev
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./agent:/app/agent
    environment:
      - NODE_ENV=development
      - DEBUG=nexo:*
    networks:
      - nexo-net

  db:
    networks:
      - nexo-net
