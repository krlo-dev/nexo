version: '3.9'

services:
  frontend:
    build:
      context: ./frontend
      args:
        NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - nexo-net

  backend:
    environment:
      - NODE_ENV=production
    volumes:
      - ./agent:/app/agent
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - nexo-net

  # db service intentionally omitted — use RDS via DB_HOST env var
